<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card p-4">
        <h3 class="mb-3">Signup</h3>
        <form (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input name="username" [(ngModel)]="username" class="form-control" required />
          </div>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input name="email" [(ngModel)]="email" type="email" class="form-control" required />
          </div>

          <div class="mb-3">
            <label class="form-label">Password</label>
            <input name="password" [(ngModel)]="password" type="password" class="form-control" required />
          </div>

          <div class="mb-3">
            <label class="form-label">Re-enter Password</label>
            <input name="confirm" [(ngModel)]="confirm" type="password" class="form-control" required />
          </div>

          <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

          <button class="btn btn-success w-100" [disabled]="loading">
            {{ loading ? 'Signing up...' : 'Signup' }}
          </button>
        </form>

        <p class="mt-3 text-center">Already have an account? <a routerLink="/login">Login</a></p>
      </div>
    </div>
  </div>
</div>
